plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Origins mixins ship SRG names; remap them for official-mapped userdev.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Origins-Forge 1.20.1 (CurseForge project 474438, file 5311982 ≈ 1.10.0.x)
    // Install the matching jar in run/mods if curse maven resolution fails.
    implementation fg.deobf('curse.maven:origins-forge-474438:5311982')

    // Apoli/Calio are jar-in-jar inside Origins; compile against extracted APIs for ModeService.
    compileOnly files(
            'libs/apoli-forge-1.20.1-2.9.0.7.jar',
            'libs/calio-forge-1.20.1-1.11.0.4.jar',
            'libs/cloth-config-11.1.136-forge.jar'
    )

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ลงลายเซ็น jar ด้วยใบรับรองเดียวกับ MTC Craft (Tacoparoni Studio)
// keystore อยู่นอก repo ที่ ~/.mtccraft/tacoparoni.jks (หรือ $MTC_RELEASE_HOME) รหัสผ่านจาก MTC_KEYSTORE_PASS
// ไม่มี keystore หรือรหัสผ่าน jar ยังสร้างได้ตามปกติ แค่ไม่มีลายเซ็น · ห้าม commit keystore
def releaseHome = System.getenv('MTC_RELEASE_HOME') ? new File(System.getenv('MTC_RELEASE_HOME'))
        : new File(System.getProperty('user.home'), '.mtccraft')
def keystoreFile = new File(releaseHome, 'tacoparoni.jks')

var signJar = tasks.register('signJar') {
    group = 'build'
    description = 'Signs the reobfuscated jar with the Tacoparoni Studio certificate.'
    dependsOn 'reobfJar'
    doLast {
        // ForgeGradle 6 เขียนผล reobf ทับไฟล์ jar เดิม จึงลงลายเซ็นที่ไฟล์ของ task jar
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def pass = System.getenv('MTC_KEYSTORE_PASS')
        if (!keystoreFile.exists() || !pass) {
            logger.warn("signJar: no keystore at ${keystoreFile} or MTC_KEYSTORE_PASS not set, jar left unsigned")
            return
        }
        ant.signjar(jar: jarFile, alias: 'tacoparoni', keystore: keystoreFile, storepass: pass,
                sigalg: 'SHA256withRSA', digestalg: 'SHA-256')
        logger.lifecycle("signJar: signed ${jarFile.name}")
    }
}

tasks.named('build') { finalizedBy signJar }

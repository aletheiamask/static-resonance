modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Created by Pipothai. YouTube: https://www.youtube.com/@Tuna_Sandwich_TOT"
displayURL="https://www.youtube.com/@Tuna_Sandwich_TOT"
logoFile="logo.png"
